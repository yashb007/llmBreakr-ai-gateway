# Optional. Safe to scale beyond 1 replica — auth/rate-limit/budget state
# lives in Redis, not in-process, so any pod can serve any request. Requires
# metrics-server installed in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llmbreakr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llmbreakr
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
