# Template for sensitive config — copy this file to secret.yaml, fill in
# real values, and apply that instead. secret.yaml is gitignored; never
# commit it (same rule as .env).
#
#   cp secret.example.yaml secret.yaml
#   $EDITOR secret.yaml
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: llmbreakr-secrets
type: Opaque
stringData:
  DB_USER: "llmbreakr"
  DB_PASSWORD: "changeme"
  # REDIS_PASSWORD: ""

  # Any random 32+ char string.
  JWT_SECRET: "changeme"
  # 32-byte key (64 hex chars) used to encrypt stored provider credentials at rest.
  # Generate with: openssl rand -hex 32
  CREDENTIAL_ENCRYPTION_KEY: "changeme"
  # Random secret path used as a deploy probe endpoint (GET /<value>). Generate with: openssl rand -hex 16
  LOADER_HASH: "changeme"

  # Optional — enterprise license key. Omit entirely for community edition.
  # LLMBREAKR_LICENSE_KEY: ""
