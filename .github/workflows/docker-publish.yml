name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  # Lets auto-release.yml (commit-message-triggered releases) reuse this same
  # build/push logic instead of duplicating it — see that workflow.
  workflow_call:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.4). Required when called, not needed for a direct tag push."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/llmbreakr-ai-gateway
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/llmbreakr-ai-gateway
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A direct tag push already checks out that tag by default (empty
          # ref = leave it alone); a workflow_call needs to be told which tag
          # the caller just pushed, since it doesn't run on a tag event itself.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only runs once DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist — until
      # then, GHCR publishing still works and this step is skipped, not failed.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - id: tags
        run: |
          TAGS="${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}
          ${{ env.GHCR_IMAGE }}:latest"
          if [ -n "${{ env.DOCKERHUB_USERNAME }}" ]; then
            TAGS="$TAGS
          ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}
          ${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
