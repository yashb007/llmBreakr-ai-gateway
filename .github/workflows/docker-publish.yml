name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/llmbreakr-ai-gateway
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/llmbreakr-ai-gateway
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only runs once DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist — until
      # then, GHCR publishing still works and this step is skipped, not failed.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: tags
        run: |
          TAGS="${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}
          ${{ env.GHCR_IMAGE }}:latest"
          if [ -n "${{ env.DOCKERHUB_USERNAME }}" ]; then
            TAGS="$TAGS
          ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}
          ${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
